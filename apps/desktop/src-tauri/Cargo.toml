[package]
name = "senate-desktop"
version = "0.1.0"
edition = "2021"
description = "Senate desktop shell: embeds a Senate node and shows its UI in a native window"

# Detached from the root workspace so the core crates build fast without the GUI stack.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
senate-node = { path = "../../../crates/senate-node" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# a job object ties the tunnel's ssh to this app: when the app goes, however it goes, ssh goes with it
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = "s"
panic = "abort"
